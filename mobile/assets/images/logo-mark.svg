<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sun" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.45" stop-color="#f2c15a"/>
      <stop offset="1" stop-color="#cf8a26"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2c15a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2c15a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2257"/>
      <stop offset="1" stop-color="#1c0f2c"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="700"/></clipPath>
  </defs>
  <!-- glow and rising sun, cut by the horizon -->
  <circle cx="512" cy="520" r="360" fill="url(#glow)"/>
  <circle cx="512" cy="540" r="236" fill="url(#sun)" clip-path="url(#above)"/>
  <!-- lotus: five petals, dark against the sun, edged in gold -->
  <g stroke="#f2c15a" stroke-width="12" stroke-linejoin="round" fill="url(#petal)">
    <path d="M512 742 C 400 690, 300 600, 236 486 C 352 500, 452 576, 512 742 Z"/>
    <path d="M512 742 C 624 690, 724 600, 788 486 C 672 500, 572 576, 512 742 Z"/>
    <path d="M512 742 C 420 660, 372 540, 384 404 C 456 470, 506 590, 512 742 Z"/>
    <path d="M512 742 C 604 660, 652 540, 640 404 C 568 470, 518 590, 512 742 Z"/>
    <path d="M512 742 C 448 640, 446 492, 512 352 C 578 492, 576 640, 512 742 Z"/>
  </g>
  <!-- water lines -->
  <g stroke="#f2c15a" stroke-linecap="round" fill="none">
    <path d="M300 792 C 400 772, 624 772, 724 792" stroke-width="14"/>
    <path d="M372 846 C 452 830, 572 830, 652 846" stroke-width="10" stroke-opacity="0.7"/>
  </g>
</svg>
