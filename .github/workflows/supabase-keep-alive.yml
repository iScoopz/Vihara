name: Supabase Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 3 days at 04:00 UTC to prevent Supabase Free Tier from auto-pausing (7-day rule)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gmppuqnxovufskcrlnwz.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcHB1cW54b3Z1ZnNrY3Jsbnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1ODQzNDQsImV4cCI6MjEwMDE2MDM0NH0.SsJM5l76cTKPQ-Pa5rLZyVGxKl6DGHvwVCZylgGg6QA' }}
        run: |
          echo "Sending keep-alive ping to Supabase: $SUPABASE_URL"
          STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase HTTP Response Code: $STATUS_CODE"
          cat response.json
          echo ""

          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
            echo "SUCCESS: Supabase activity registered! The 7-day inactivity pause counter has been reset."
          else
            echo "ERROR: Request failed with status code $STATUS_CODE"
            exit 1
          fi
